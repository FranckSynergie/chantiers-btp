<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Chantiers BTP">
  <meta name="theme-color" content="#0D2137">
  <title>Synergie BTP — Recherche Chantier</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy:   #0D2137;
      --blue:   #1565C0;
      --accent: #FFC107;
      --green:  #00C853;
      --red:    #FF1744;
      --white:  #F0F4F8;
      --glass:  rgba(255,255,255,0.06);
      --glass2: rgba(255,255,255,0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Syne', sans-serif;
      background: var(--navy);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
      color: var(--white);
    }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 10% 10%, rgba(21,101,192,0.35) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 90% 80%, rgba(0,200,83,0.12) 0%, transparent 55%),
        radial-gradient(ellipse 50% 40% at 50% 50%, rgba(255,193,7,0.06) 0%, transparent 50%);
      pointer-events: none; z-index: 0;
    }
    .container {
      position: relative; z-index: 1;
      width: 100%; max-width: 520px;
      padding: 0 16px 48px;
      display: flex; flex-direction: column; align-items: center;
    }

    /* HEADER */
    header { width: 100%; padding: 48px 0 26px; text-align: center; }
    .logo-badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--glass2);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 100px; padding: 6px 16px 6px 8px;
      margin-bottom: 16px; font-size: 12px; font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: rgba(255,255,255,0.7); backdrop-filter: blur(10px);
    }
    .logo-dot {
      width: 8px; height: 8px; background: var(--green);
      border-radius: 50%; box-shadow: 0 0 8px var(--green);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(.8)}
    }
    h1 { font-size: clamp(26px,7vw,36px); font-weight: 800; line-height: 1.1; letter-spacing: -.02em; }
    h1 span { color: var(--accent); display: block; }
    .subtitle { margin-top: 8px; font-size: 13px; color: rgba(255,255,255,.4); }

    /* SEARCH CARD */
    .search-card {
      width: 100%; background: var(--glass);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 22px; padding: 18px;
      backdrop-filter: blur(20px); margin-bottom: 12px;
    }
    .search-label {
      font-size: 11px; font-weight: 600; letter-spacing: .1em;
      text-transform: uppercase; color: rgba(255,255,255,.4); margin-bottom: 10px;
    }
    .search-hints { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 12px; }
    .hint-tag {
      font-size: 10px; font-weight: 600; letter-spacing: .06em;
      text-transform: uppercase; background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.1); border-radius: 6px;
      padding: 3px 8px; color: rgba(255,255,255,.4);
      transition: all .2s;
    }
    .hint-tag.active {
      background: rgba(255,193,7,.18); border-color: rgba(255,193,7,.4);
      color: var(--accent);
    }
    .search-wrap { position: relative; display: flex; align-items: center; }
    .search-ico { position: absolute; left: 15px; font-size: 17px; opacity: .45; pointer-events: none; }
    #searchInput {
      width: 100%; background: rgba(255,255,255,.08);
      border: 2px solid rgba(255,193,7,.4); border-radius: 14px;
      padding: 15px 44px 15px 46px;
      font-family: 'Syne', sans-serif; font-size: 17px; font-weight: 600;
      color: var(--white); outline: none;
      transition: border-color .2s, background .2s, box-shadow .2s;
      -webkit-appearance: none;
    }
    #searchInput::placeholder { color: rgba(255,255,255,.22); font-weight: 400; }
    #searchInput:focus {
      border-color: var(--accent); background: rgba(255,255,255,.12);
      box-shadow: 0 0 0 4px rgba(255,193,7,.12);
    }
    .clear-btn {
      position: absolute; right: 12px;
      background: rgba(255,255,255,.1); border: none; border-radius: 50%;
      width: 28px; height: 28px; display: none;
      align-items: center; justify-content: center;
      font-size: 13px; color: rgba(255,255,255,.6); cursor: pointer;
    }
    .clear-btn.visible { display: flex; }
    .clear-btn:active { background: rgba(255,255,255,.2); }

    /* RESULT SUMMARY */
    .result-box {
      width: 100%; background: var(--glass);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 22px; padding: 16px 18px;
      backdrop-filter: blur(20px); margin-bottom: 12px;
      min-height: 70px; display: flex; flex-direction: column; justify-content: center;
    }
    .result-box-label {
      font-size: 10px; font-weight: 600; letter-spacing: .1em;
      text-transform: uppercase; color: rgba(255,255,255,.3); margin-bottom: 8px;
    }
    .state-idle   { font-size: 14px; color: rgba(255,255,255,.2); }
    .state-none   { font-size: 15px; color: var(--red); font-weight: 600; }
    .codes-wrap   { display: flex; flex-wrap: wrap; gap: 6px; }
    .code-chip {
      font-family: 'DM Mono', monospace; font-size: 13px; font-weight: 500;
      background: rgba(0,200,83,.12); border: 1px solid rgba(0,200,83,.3);
      border-radius: 8px; padding: 4px 10px; color: var(--green);
      cursor: pointer; transition: background .15s;
    }
    .code-chip:active { background: rgba(0,200,83,.25); }
    .codes-more { font-size: 11px; color: rgba(255,255,255,.28); padding: 4px 2px; align-self: center; }

    /* DETAIL PANEL (1 résultat exact) */
    .detail-panel {
      width: 100%; background: rgba(0,200,83,.07);
      border: 1px solid rgba(0,200,83,.25);
      border-radius: 22px; padding: 18px;
      backdrop-filter: blur(20px); margin-bottom: 12px;
      display: none;
    }
    .detail-panel.visible { display: block; }
    .detail-row { display: flex; flex-direction: column; gap: 2px; margin-bottom: 12px; }
    .detail-row:last-child { margin-bottom: 0; }
    .detail-key {
      font-size: 10px; font-weight: 600; letter-spacing: .1em;
      text-transform: uppercase; color: rgba(255,255,255,.35);
    }
    .detail-val {
      font-size: 16px; font-weight: 700; color: var(--white); line-height: 1.3;
    }
    .detail-val.mono { font-family: 'DM Mono', monospace; color: var(--green); font-size: 22px; }

    /* LIST */
    .list-header {
      width: 100%; display: flex; align-items: center;
      justify-content: space-between; margin-bottom: 10px;
    }
    .list-title { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: rgba(255,255,255,.3); }
    .count-badge { font-size: 11px; font-weight: 600; background: rgba(255,193,7,.15); color: var(--accent); border-radius: 100px; padding: 3px 10px; }

    .chantier-list { width: 100%; display: flex; flex-direction: column; gap: 5px; }
    .ch-item {
      display: flex; align-items: stretch;
      border-radius: 14px; background: var(--glass);
      border: 1px solid rgba(255,255,255,.06);
      cursor: pointer; overflow: hidden;
      transition: background .15s, border-color .15s;
      animation: slideIn .22s ease both;
    }
    @keyframes slideIn { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }
    .ch-item:active { background: var(--glass2); }
    .ch-item.top { background: rgba(0,200,83,.08); border-color: rgba(0,200,83,.25); }
    .ch-bar { width: 4px; min-width: 4px; flex-shrink: 0; }
    .ch-body { flex: 1; padding: 10px 13px; display: flex; flex-direction: column; gap: 3px; }
    .ch-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .ch-code { font-family: 'DM Mono', monospace; font-size: 12px; font-weight: 500; color: var(--green); flex-shrink: 0; }
    .ch-client { font-size: 13px; font-weight: 700; color: var(--white); flex: 1; }
    .ch-cc { font-family: 'DM Mono', monospace; font-size: 10px; color: rgba(255,255,255,.32); background: rgba(255,255,255,.06); border-radius: 4px; padding: 1px 6px; flex-shrink: 0; }
    .ch-lib { font-size: 12px; color: rgba(255,255,255,.48); line-height: 1.3; }
    mark { background: rgba(255,193,7,.28); color: var(--accent); border-radius: 2px; padding: 0 2px; }

    .show-more {
      width: 100%; margin-top: 8px; padding: 12px;
      background: var(--glass); border: 1px solid rgba(255,255,255,.08);
      border-radius: 14px; color: rgba(255,255,255,.45);
      font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 600;
      cursor: pointer; text-align: center; display: none;
    }
    .show-more:active { background: var(--glass2); }

    footer { margin-top: 28px; font-size: 11px; color: rgba(255,255,255,.18); text-align: center; letter-spacing: .04em; }
  </style>
</head>

<div class="container">

  <header>
    <div class="logo-badge"><span class="logo-dot"></span>Synergie BTP</div>
    <h1>Recherche<span>Chantier</span></h1>
    <p class="subtitle">774 chantiers · Guadeloupe</p>

  <!-- Résumé / codes trouvés -->

    </div>

    </div>
    <div class="detail-row">

      <span class="detail-val" id="d-cc"></span>
    </div>
    <div class="detail-row">
      <span class="detail-key">Libellé</span>

    </div>

  <!-- Liste filtrée -->
  <div class="list-header">

    <span class="count-badge" id="countBadge">0</span>
  </div>
  <div class="chantier-list" id="chantierList"></div>
  <button class="show-more" id="showMoreBtn" onclick="showMore()"></button>

  <footer>Synergie BTP · Avril 2026</footer>
</div>

  const i = s.toUpperCase().indexOf(q);
  if (i < 0) return s;
  return s.slice(0,i) + '<mark>' + s.slice(i, i+q.length) + '</mark>' + s.slice(i+q.length);

  // Liste
  renderList(true);
}

function renderList(reset) {
  if (reset) listEl.innerHTML = '';
  if (!matched.length) { showMoreBtn.style.display='none'; return; }

  const start = (page-1)*PAGE;
  matched.slice(start, start+PAGE).forEach(([cl,cc,ch,lb], i) => {
    const dbIdx = DB.findIndex(r => r[2]===ch && r[0]===cl);
    const q = inp.value.trim().toUpperCase();
    const div = document.createElement('div');
    div.className = 'ch-item' + (i===0 && page===1 ? ' top' : '');
    div.style.animationDelay = Math.min(i*12,160)+'ms';
    div.innerHTML =
      `<div class="ch-bar" style="background:${color(dbIdx)}"></div>
       <div class="ch-body">
         <div class="ch-top">
           <span class="ch-code">${hl(ch,q)}</span>
           <span class="ch-client">${hl(cl,q)}</span>
           <span class="ch-cc">${hl(cc,q)}</span>
         </div>
         <div class="ch-lib">${hl(lb,q)}</div>
       </div>`;
    div.addEventListener('click', () => selectCode(ch));
    listEl.appendChild(div);
  });

  const shown = Math.min(page*PAGE, matched.length);
  if (shown < matched.length) {
    showMoreBtn.style.display = 'block';
    showMoreBtn.textContent   = `Voir plus — ${matched.length-shown} restants`;
  } else {
    showMoreBtn.style.display = 'none';
  }
}

function showMore() { page++; renderList(false); }

function selectCode(code) {
  inp.value = code;
  clearBtn.classList.add('visible');
  render(code);
  window.scrollTo({top:0, behavior:'smooth'});
}

function clearSearch() {
  inp.value = '';
  clearBtn.classList.remove('visible');
  render('');
  inp.focus();
}

inp.addEventListener('input', e => {
  clearBtn.classList.toggle('visible', inp.value.trim().length > 0);
  render(inp.value);
});

// Init
countBadge.textContent = DB.length;

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
