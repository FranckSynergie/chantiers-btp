<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0d1b2a" />
  <title>Recherche Chantier — Synergie BTP</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:      #0d1b2a;
      --card:    #1a2d42;
      --border:  #2a4060;
      --accent:  #f97316;
      --accent2: #fb923c;
      --text:    #e2e8f0;
      --muted:   #94a3b8;
      --hit:     #fef08a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Syne', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 40px;
    }
    header {
      text-align: center;
      margin-bottom: 28px;
    }
    .logo-img {
      max-width: 260px;
      width: 100%;
      height: auto;
      margin: 0 auto 10px;
      display: block;
      filter: drop-shadow(0 2px 12px rgba(30,90,180,.4));
    }
    .subtitle { font-size: .8rem; color: var(--muted); margin-top: 4px; font-family: 'DM Mono', monospace; }
    .search-wrap {
      width: 100%; max-width: 520px;
      position: relative; margin-bottom: 16px;
    }
    #q {
      width: 100%;
      background: var(--card);
      border: 1.5px solid var(--border);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 1rem;
      padding: 14px 48px 14px 16px;
      border-radius: 12px;
      outline: none;
      transition: border-color .2s;
    }
    #q:focus { border-color: var(--accent); }
    #q::placeholder { color: var(--muted); }
    .clear-btn {
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: var(--muted); font-size: 1.2rem; display: none;
    }
    #stats {
      font-size: .72rem; color: var(--muted);
      font-family: 'DM Mono', monospace;
      margin-bottom: 12px; text-align: center;
    }
    #results {
      width: 100%; max-width: 520px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: border-color .15s, transform .1s;
      display: flex; align-items: center; gap: 12px;
    }
    .card:hover { border-color: var(--accent); transform: translateX(2px); }
    .card:active { transform: scale(.98); }
    .code-badge {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      font-family: 'DM Mono', monospace;
      font-size: .7rem;
      font-weight: 500;
      padding: 3px 8px;
      border-radius: 6px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .card-body { min-width: 0; }
    .client-name {
      font-size: .88rem; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .libelle {
      font-size: .73rem; color: var(--muted); margin-top: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    mark { background: var(--hit); color: #1a1a1a; border-radius: 2px; padding: 0 1px; }
    .empty { text-align: center; color: var(--muted); padding: 40px 0; font-size: .9rem; }
    .copied-toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: var(--accent); color: #fff;
      padding: 8px 20px; border-radius: 20px;
      font-size: .8rem; font-family: 'DM Mono', monospace;
      opacity: 0; pointer-events: none;
      transition: opacity .3s;
    }
    .copied-toast.show { opacity: 1; }
    footer {
      margin-top: 32px; font-size: .68rem;
      color: var(--muted); font-family: 'DM Mono', monospace; text-align: center;
    }
  </style>
</head>

  <div class="search-wrap">
    <input id="q" type="search" placeholder="Client, code ou libellé…" autocomplete="off" autocorrect="off" spellcheck="false" />
    <button class="clear-btn" id="clearBtn" title="Effacer">✕</button>
  </div>
  <div id="stats"></div>
  <div id="results"></div>
  <div class="copied-toast" id="toast">Code copié !</div>
  <footer id="footer">Synergie BTP</footer>

  <script>
  let DB = [];
  // [nom_client, nom_display, code, libelle]

  const q       = document.getElementById('q');
  const results = document.getElementById('results');
  const stats   = document.getElementById('stats');
  const clearBtn= document.getElementById('clearBtn');
  const toast   = document.getElementById('toast');

  function hl(text, term) {
    if (!term) return text;
    const re = new RegExp(`(${term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi');
    return text.replace(re, '<mark>$1</mark>');
  }

  function render(term) {
    const t = term.trim().toLowerCase();
    clearBtn.style.display = t ? 'block' : 'none';

    if (!t) {
      stats.textContent = `les 810 chantiers — tapez pour filtrer`;
      results.innerHTML = '';
      return;
    }

    const words = t.split(/\s+/);
    const hits = DB.filter(([nom,,code,lib]) =>
      words.every(w =>
        nom.toLowerCase().includes(w) ||
        code.toLowerCase().includes(w) ||
        lib.toLowerCase().includes(w)
      )
    );

    stats.textContent = `${hits.length} résultat${hits.length!==1?'s':''} sur ${DB.length}`;

    if (!hits.length) {
      results.innerHTML = '<div class="empty">Aucun chantier trouvé</div>';
      return;
    }

    results.innerHTML = hits.map(([nom,,code,lib]) => `
      <div class="card" onclick="copy('${code}')">
        <div class="code-badge">${hl(code, term.trim())}</div>
        <div class="card-body">
          <div class="client-name">${hl(nom, term.trim())}</div>
          <div class="libelle">${hl(lib, term.trim())}</div>
        </div>
      </div>
    `).join('');
  }

  function copy(code) {
    navigator.clipboard.writeText(code).catch(()=>{});
    toast.textContent = `${code} copié !`;
    toast.classList.add('show');
    setTimeout(()=>toast.classList.remove('show'), 1800);
  }

  q.addEventListener('input', ()=>render(q.value));
  clearBtn.addEventListener('click', ()=>{ q.value=''; q.focus(); render(''); });

  const subtitle = document.getElementById('subtitle');
  const footer   = document.getElementById('footer');

  function applyData(data) {
    DB = data.chantiers || [];
    subtitle.textContent = `Recherche chantier · ${DB.length} chantiers`;
    footer.textContent = data.updated_at
      ? `Mis à jour le ${data.updated_at} · ${data.source_code || ''} · Synergie BTP`
      : 'Synergie BTP';
    render(q.value);
  }

  // Chargement de la liste des chantiers : à chaque ouverture, on va
  // chercher la version la plus fraîche sur GitHub avant tout affichage.
  // Si le téléphone est hors-ligne, le service worker renvoie la
  // dernière copie mise en cache (voir sw.js).
  async function loadChantiers() {
    stats.textContent = 'Vérification des mises à jour…';
    try {
      const resp = await fetch('./chantiers.json', { cache: 'no-store' });
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      applyData(await resp.json());
    } catch (err) {
      stats.textContent = 'Impossible de récupérer la liste à jour (hors ligne ?)';
      subtitle.textContent = 'Recherche chantier';
    }
  }

  loadChantiers();

  // Service Worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
  </script>
</body>
</html>
